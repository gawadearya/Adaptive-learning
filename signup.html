<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | Learning Path</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* 1. ANIMATED MESH GRADIENT BACKGROUND */
    body {
      margin: 0; padding: 0; font-family: 'Poppins', sans-serif;
      background: linear-gradient(-45deg, #1e1e2f, #2d1b4e, #1e3a5f, #252540);
      background-size: 400% 400%; animation: gradientBG 15s ease infinite;
      height: 100vh; display: flex; justify-content: center; align-items: center; color: white; overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 2. GLASSMORPHISM CARD */
    .card {
      width: 100%; max-width: 400px; padding: 35px; border-radius: 24px;
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3); position: relative; color: white;
    }

    /* 3. INPUT FIELD STYLING */
    .form-control {
      background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.1);
      color: white !important; border-radius: 12px; padding: 12px; transition: 0.3s;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.12); border-color: #36d1dc; color: white; box-shadow: none;
    }

    .input-group-text {
      background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5); border-radius: 0 12px 12px 0;
    }

    /* 4. BUTTONS */
    .btn-primary {
      background: linear-gradient(135deg, #36d1dc, #5b86e5); border: none;
      padding: 12px; border-radius: 12px; font-weight: 600; transition: 0.3s;
    }

    .btn-primary:hover {
      transform: translateY(-2px); box-shadow: 0 10px 20px rgba(54, 209, 220, 0.3);
    }

    .google-btn {
      border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05);
      color: white; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer;
      transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
    }

    .divider { text-align: center; margin: 15px 0; color: rgba(255, 255, 255, 0.4); font-size: 12px; letter-spacing: 1px; }

    .bottom-text { text-align: center; margin-top: 15px; font-size: 14px; color: rgba(255, 255, 255, 0.7); }
    .bottom-text a { text-decoration: none; color: #36d1dc; font-weight: 600; }

    ::placeholder { color: rgba(255, 255, 255, 0.4) !important; }

    .check-icon {
      position: absolute; right: -15px; top: -15px; background: #28a745;
      color: white; border-radius: 50%; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
    }
  </style>
</head>

<body>

<div class="card">
  <div class="check-icon"><i class="fa fa-user-plus"></i></div>
  
  <h3 class="text-center fw-bold mb-4">Create Account</h3>

  <input type="text" id="name" class="form-control mb-3" placeholder="Full Name">

  <div class="input-group mb-3">
    <input type="email" id="email" class="form-control" placeholder="Email Address">
    <span class="input-group-text"><i class="fa fa-envelope"></i></span>
  </div>

  <input type="password" id="password" class="form-control mb-4" placeholder="Password">

  <button class="btn btn-primary w-100 mb-3" onclick="signup()">Sign Up</button>

  <p class="bottom-text">
    Already have an account? <a href="login.html">Log In</a>
  </p>

  <div class="divider">OR</div>

  <button class="google-btn">
    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" width="18">
    Sign up with Google
  </button>
</div>

<script>
function signup() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!name || !email || !password) {
    alert("Please fill in all fields!");
    return;
  }

  let users = JSON.parse(localStorage.getItem("users")) || [];
  const exists = users.find(user => user.email === email);
  
  if (exists) {
    alert("User already exists with this email!");
    return;
  }

  // Initialize new user with default quiz parameters
  const newUser = { 
    name: name, 
    email: email, 
    password: password,
    score: 0,
    performance: 50, // Starting performance for the Adaptive Engine
    lastTime: 0,
    fuzzyStatus: "Beginner",
    topicAnalysis: {}
  };

  users.push(newUser);
  localStorage.setItem("users", JSON.stringify(users));

  alert("Signup successful! You can now log in.");
  window.location.href = "login.html";
}
</script>

</body>
</html>
